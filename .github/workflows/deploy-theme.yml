name: Deploy Custom Theme

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*' # Trigger production deploy on version tags (e.g., v1.0.0)
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Enable manual release execution from the GitHub Actions UI

jobs:
  test-and-validate:
    name: Test & Validate Theme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Gscan Validator
        run: |
          npx gscan themes/pueblo-patriot

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Bootstrap Ghost and Database
        run: |
          nix-shell --run "just bootstrap"

      - name: Start Services (Detached Mode)
        run: |
          nix-shell --run "process-compose up -D"

      - name: Wait for Ghost CMS to boot
        run: |
          until curl -sI http://localhost:2368/ > /dev/null; do
            echo "Waiting for local Ghost instance..."
            sleep 3
          done
          echo "Ghost CMS is online and healthy."

      - name: Seed Database with Mock Data
        run: |
          nix-shell --run "just seed"

      - name: Run E2E Integration and Layout Tests
        run: |
          nix-shell --run "just test"

      - name: Terminate Local Services
        if: always()
        run: |
          nix-shell --run "just down"


  deploy-staging:
    name: Deploy to Staging
    needs: test-and-validate
    # Deploy to staging automatically on push to default branch (not on release tags)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Staging Ghost
        uses: tryghost/action-deploy-theme@v3
        with:
          api-url: ${{ secrets.GHOST_STAGING_API_URL }}
          api-key: ${{ secrets.GHOST_STAGING_API_KEY }}
          theme-name: pueblo-patriot-staging
          file: themes/pueblo-patriot

  deploy-production:
    name: Deploy to Production
    needs: test-and-validate
    # Deploy to production only on tag push (v*) or when manually triggered via UI
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production Ghost
        uses: tryghost/action-deploy-theme@v3
        with:
          api-url: ${{ secrets.GHOST_PRODUCTION_API_URL }}
          api-key: ${{ secrets.GHOST_PRODUCTION_API_KEY }}
          theme-name: pueblo-patriot
          file: themes/pueblo-patriot

